name: Release

on:
  push:
    tags: ["v*"]

jobs:
  # Build cross-platform binaries + archives and publish a Gitea release.
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs full history and tags
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          # Gitea injects GITEA_TOKEN automatically, scoped to this repo.
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GORELEASER_FORCE_TOKEN: gitea

  # Build and push the container image to the Gitea package registry.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: git.nhsoul.fr
          username: ${{ github.actor }}
          # A PAT secret (DOCKER_TOKEN) with package:write is more reliable than
          # the auto GITEA_TOKEN if package pushes are denied.
          password: ${{ secrets.DOCKER_TOKEN || secrets.GITEA_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            git.nhsoul.fr/nhpro/orion-drive:${{ github.ref_name }}
            git.nhsoul.fr/nhpro/orion-drive:latest
