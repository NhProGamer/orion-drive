name: Release

on:
  push:
    tags: ["v*"]

# On a tag, GoReleaser does it all in one job: build the frontend once (before
# hook), cross-compile the binaries, cut the Forgejo release (archives +
# checksums), AND build+push the container image from the already-compiled
# linux/amd64 binary (see .goreleaser.yaml `dockers`). This avoids the previous
# duplicate Go compile + frontend build that a separate docker job incurred.
# Third-party actions use full github.com URLs because the Forgejo runner
# resolves bare `owner/repo` against data.forgejo.org, which only mirrors actions/*.
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history + tags are needed for the changelog and version inference.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # Node is needed by the GoReleaser `before` hook that builds the embedded SPA.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Log in so GoReleaser can push the image it builds from the binary.
      - uses: https://github.com/docker/login-action@v3
        with:
          registry: git.nhsoul.fr
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - uses: https://github.com/goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          # A Forgejo access token with repository (contents) write scope so
          # GoReleaser can attach the binary archives to the release.
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
