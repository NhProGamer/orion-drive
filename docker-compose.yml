services:
  orion-drive:
    # Prebuilt image from the Forgejo registry (docker pull git.nhsoul.fr/nhpro/orion-drive:latest).
    image: git.nhsoul.fr/nhpro/orion-drive:latest
    pull_policy: always
    # For local development from source, comment `image` above and uncomment:
    # build: .
    container_name: orion-drive
    restart: unless-stopped
    depends_on:
      - onlyoffice
    ports:
      - "5212:5212"
      # - "2222:2222" # SFTP (uncomment when OD_CONF_SFTP_Enable is true)
    volumes:
      - orion-data:/app/data
    # Every setting maps to OD_CONF_<Section>_<Key>. Values below are the full set
    # of supported variables; active ones are set, optional ones are commented
    # with their defaults/examples.
    environment:
      # ---- [System] ----
      OD_CONF_System_SiteURL: "http://localhost:5212" # public URL (OIDC redirect + share/link URLs)
      # REQUIRED: in release mode the server REFUSES TO START while this is empty,
      # the shipped default, or shorter than 16 chars (it keys session + WOPI
      # tokens). Generate one: openssl rand -hex 32
      OD_CONF_System_SessionSecret: "change-me-to-a-long-random-string"
      # release | debug. debug relaxes the session-secret check; the dev-login
      # shortcut additionally needs an image built with `-tags dev` (the published
      # image is NOT, so dev-login is unavailable regardless of this).
      OD_CONF_System_Mode: "release"
      # Reverse-proxy IPs/CIDRs whose X-Forwarded-For is trusted for client-IP
      # resolution (per-IP rate limiting). Empty trusts none (client IP = direct
      # peer). Behind a proxy set it, e.g. your Docker network: 172.16.0.0/12
      # OD_CONF_System_TrustedProxies: ""
      # OD_CONF_System_Listen: ":5212"                # bind address (image default)

      # ---- [Database] ----
      # sqlite (default, zero-config) | postgres | mysql
      OD_CONF_Database_Type: "sqlite"
      # OD_CONF_Database_DBFile: "/app/data/orion.db" # sqlite file path (image default)
      # To use PostgreSQL: set Type=postgres, start with `--profile postgres`
      # (brings up the `postgres` service below), and set the fields:
      # OD_CONF_Database_Host: "postgres"
      # OD_CONF_Database_Port: "5432"
      # OD_CONF_Database_User: "orion"
      # OD_CONF_Database_Password: "orion"
      # OD_CONF_Database_Name: "orion"
      # OD_CONF_Database_SSLMode: "disable"        # postgres only
      # For MySQL: Type=mysql, `--profile mysql`, Host=mysql, Port=3306.

      # ---- [OIDC] (SSO login; the only real auth — dev-login needs a `-tags dev` build) ----
      # OD_CONF_OIDC_Issuer: "https://accounts.google.com"
      # OD_CONF_OIDC_ClientID: ""
      # OD_CONF_OIDC_ClientSecret: ""
      # OD_CONF_OIDC_RedirectURI: "http://localhost:5212/api/v1/auth/oidc/callback"
      # OD_CONF_OIDC_Scopes: "openid profile email"

      # ---- [Storage] ----
      # OD_CONF_Storage_LocalBasePath: "/app/data/storage" # local policy base dir (image default)
      # 64-char hex (32-byte) AES-256 key for policies created with `policy add-local --encrypt`:
      # OD_CONF_Storage_EncryptionKey: ""
      # Content-addressed deduplication: off (default) | user (safe, dedups a
      # user's own uploads) | global (dedups across users — saves the most disk
      # but a dedup hit leaks that another user already stored that exact content).
      # Encrypted policies are never deduplicated.
      # OD_CONF_Storage_Dedup: "off"

      # ---- [Slave] (set Secret to make this node a storage slave for a master) ----
      # OD_CONF_Slave_Secret: ""
      # OD_CONF_Slave_StoragePath: "/app/data/slave-storage"

      # ---- [WOPI] online Office editing via the `onlyoffice` service below ----
      # IMPORTANT: OnlyOffice (in its container) calls back to OrionDrive's WOPI
      # endpoint, whose URL is derived from SiteURL. So SiteURL *and* the URLs
      # below must all resolve to a host reachable by BOTH the browser and the
      # onlyoffice container — a real LAN IP or domain, NOT `localhost`.
      # Replace `office.example` (and set SiteURL accordingly) for a working setup.
      OD_CONF_WOPI_ServerURL: "http://office.example:8080"
      # {type} is replaced per document (word/cell/slide) so .docx/.xlsx/.pptx all work;
      # {src} is the WOPISrc. OrionDrive serves an auto-submitting POST launch page
      # (the editor is opened via a WOPI form POST + iframe, not a plain GET).
      OD_CONF_WOPI_EditURLTemplate: "http://office.example:8080/hosting/wopi/{type}/edit?WOPISrc={src}"

      # ---- [WebDAV] file access over WebDAV at <SiteURL>/dav ----
      # Enabled by default. Users create dedicated WebDAV credentials (username +
      # generated password) from the "Accès WebDAV" panel in the app; those are
      # independent of the SSO login. Set to "false" to disable the endpoint.
      OD_CONF_WebDAV_Enable: "true"

      # ---- [SFTP] file access over SFTP (same credentials as WebDAV) ----
      # Disabled by default; opens a separate SSH port. Enable and publish the
      # port below to let clients mount the drive over sftp://.
      # OD_CONF_SFTP_Enable: "true"
      # OD_CONF_SFTP_Listen: ":2222"
      # OD_CONF_SFTP_HostKeyPath: "/app/data/ssh_host_ed25519_key"

      # ---- [Redis] (shared cache; needed when running several nodes) ----
      # Start with `--profile redis` to bring up the `redis` service below, then:
      # OD_CONF_Redis_Server: "redis:6379"
      # OD_CONF_Redis_Password: ""
      # OD_CONF_Redis_DB: "0"

  # OnlyOffice Document Server — the WOPI client that renders/edits Office files.
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice
    restart: unless-stopped
    environment:
      WOPI_ENABLED: "true" # act as a WOPI client for OrionDrive's WOPI host
      JWT_ENABLED: "true"
      JWT_SECRET: "change-me-onlyoffice-jwt-secret" # CHANGE this
    ports:
      - "8080:80" # editor UI (browser-facing); must match the WOPI URLs above
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-logs:/var/log/onlyoffice

  # PostgreSQL — optional. Enable with `docker compose --profile postgres up`
  # and point OrionDrive at it (see the [Database] env block above).
  postgres:
    image: postgres:16-alpine
    container_name: orion-postgres
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: "orion"
      POSTGRES_PASSWORD: "orion" # CHANGE this (must match OD_CONF_Database_Password)
      POSTGRES_DB: "orion"
    volumes:
      - orion-postgres:/var/lib/postgresql/data

  # MySQL — optional. Enable with `docker compose --profile mysql up`.
  mysql:
    image: mysql:8
    container_name: orion-mysql
    restart: unless-stopped
    profiles: ["mysql"]
    environment:
      MYSQL_DATABASE: "orion"
      MYSQL_USER: "orion"
      MYSQL_PASSWORD: "orion" # CHANGE this (must match OD_CONF_Database_Password)
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - orion-mysql:/var/lib/mysql

  # Redis — optional shared cache. Enable with `docker compose --profile redis up`.
  redis:
    image: redis:7-alpine
    container_name: orion-redis
    restart: unless-stopped
    profiles: ["redis"]
    volumes:
      - orion-redis:/data

volumes:
  orion-data:
  onlyoffice-data:
  onlyoffice-logs:
  orion-postgres:
  orion-mysql:
  orion-redis:
