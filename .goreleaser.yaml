# GoReleaser — build tagged SemVer releases (https://goreleaser.com).
# On a pushed tag the `.gitea/workflows/release.yaml` CI job runs
# `goreleaser release --clean` (with GITEA_TOKEN) to attach the binary archives
# to the Gitea release. Locally: `goreleaser release --clean --skip=publish`.
version: 2
project_name: orion-drive

before:
  hooks:
    - go mod tidy
    # Build the Vue SPA so it is embedded (application/statics/dist) into the binary.
    - sh -c "cd frontend && npm ci && npm run build"

builds:
  - id: orion-drive
    main: .
    binary: orion-drive
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/NhProGamer/orion-drive/application/constants.Version={{ .Version }}
      - -X github.com/NhProGamer/orion-drive/application/constants.Commit={{ .ShortCommit }}
      - -X github.com/NhProGamer/orion-drive/application/constants.Date={{ .CommitDate }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - conf.ini.example

checksum:
  name_template: "checksums.txt"

# Build & push the container image from the already-compiled linux/amd64 binary
# (SPA embedded), so Go is not recompiled and the frontend is not rebuilt a
# second time. The runner must `docker login` to git.nhsoul.fr beforehand.
dockers:
  - id: orion-drive
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.release
    image_templates:
      # .Tag keeps the leading "v" (v0.16.1), matching the previous image tags.
      - "git.nhsoul.fr/nhpro/orion-drive:{{ .Tag }}"
      - "git.nhsoul.fr/nhpro/orion-drive:latest"
    build_flag_templates:
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://git.nhsoul.fr/nhpro/orion-drive"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Publish releases to the self-hosted Gitea instance (needs GITEA_TOKEN).
# The Forgejo Actions runner also injects a GITHUB_TOKEN into the environment,
# so pin the publisher to Gitea to avoid goreleaser's "multiple tokens" error.
force_token: gitea

release:
  gitea:
    owner: nhpro
    name: orion-drive

gitea_urls:
  api: https://git.nhsoul.fr/api/v1
  download: https://git.nhsoul.fr
