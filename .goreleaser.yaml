# GoReleaser — build tagged SemVer releases (https://goreleaser.com).
# On a pushed tag the `.gitea/workflows/release.yaml` CI job runs
# `goreleaser release --clean` (with GITEA_TOKEN) to publish the archives.
# Locally you can dry-run the build with `goreleaser release --clean --skip=publish`.
version: 2
project_name: orion-drive

before:
  hooks:
    - go mod tidy
    # Build the Vue SPA so it is embedded (application/statics/dist) into the binary.
    - sh -c "cd frontend && npm ci && npm run build"

builds:
  - id: orion-drive
    main: .
    binary: orion-drive
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/NhProGamer/orion-drive/application/constants.Version={{ .Version }}
      - -X github.com/NhProGamer/orion-drive/application/constants.Commit={{ .ShortCommit }}
      - -X github.com/NhProGamer/orion-drive/application/constants.Date={{ .CommitDate }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - conf.ini.example

# Build an RPM (from the linux binaries) with the systemd unit and config.
nfpms:
  - id: rpm
    ids: [orion-drive]
    package_name: orion-drive
    formats: [rpm]
    vendor: OrionDrive
    homepage: https://git.nhsoul.fr/nhpro/orion-drive
    maintainer: nhpro <contact@clown.art>
    description: Self-hosted file management — OrionDrive server (single binary, embedded SPA).
    license: MIT
    bindir: /usr/bin
    contents:
      - src: packaging/orion-drive.service
        dst: /usr/lib/systemd/system/orion-drive.service
      - src: conf.ini.example
        dst: /etc/orion-drive/conf.ini.example
        type: config|noreplace
      - src: README.md
        dst: /usr/share/doc/orion-drive/README.md
      - src: LICENSE
        dst: /usr/share/doc/orion-drive/LICENSE

# Push the built RPMs to the Forgejo RPM package registry (needs a GITEA_TOKEN
# with write:package scope). Runs as part of `goreleaser release`.
publishers:
  - name: forgejo-rpm
    ids: [rpm]
    cmd: >-
      curl --fail-with-body -sS
      -H "Authorization: token {{ .Env.GITEA_TOKEN }}"
      --upload-file "{{ .ArtifactPath }}"
      https://git.nhsoul.fr/api/packages/nhpro/rpm/upload

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Publish releases to the self-hosted Gitea instance (needs GITEA_TOKEN).
# The Forgejo Actions runner also injects a GITHUB_TOKEN into the environment,
# so pin the publisher to Gitea to avoid goreleaser's "multiple tokens" error.
force_token: gitea

release:
  gitea:
    owner: nhpro
    name: orion-drive

gitea_urls:
  api: https://git.nhsoul.fr/api/v1
  download: https://git.nhsoul.fr
